<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <!-- Moved script tag outside of title tag into head -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <style>
        *{
            box-sizing: border-box; /* Fixed: changed box-shadow to box-sizing */
        }
        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: Arial, Helvetica, sans-serif;
            background: #033240;
        }
        .card{
            width: 360px; 
            padding: 30px;
            margin-top: 2rem;
            text-align: center;
            background: white;     
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        h2{
            margin-bottom: 8px;
        }
        p{
            color: #777;
            margin-bottom: 25px;
        }
        input{
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }
        button{
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            background: #111;
            color: #fff;
        }
        #qrcode{
            margin: 25px auto 10px;
            width: fit-content;
        }
        #download{
            display: none;
            background: #16a34a;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Smart QRcode Generator</h2>
        <p>Turn any link into a QR code</p>
        <input type="url" id="link" placeholder="https://example.com">

        <button onclick="generateQR()">Generate QR Code</button>

        <div id="qrcode"></div>
        <button id="download" onclick="downloadQR()">Download QR Code</button>
    </div>

    <script>
        function generateQR(){
            const link = document.getElementById("link").value;
            const qr = document.getElementById("qrcode");
            const download = document.getElementById("download");

            if(!link.trim()) return alert("Enter a link first");

            qr.innerHTML = "";

            new QRCode(qr, {
                text: link,
                width: 180,
                height: 180
            });

            download.style.display = "block";
        }

        function downloadQR() {
            const img = document.querySelector("#qrcode img");
            const canvas = document.querySelector("#qrcode canvas");

            const link = document.createElement("a");
            link.download = "qrcode.png";

            // Support both image src and canvas data URL formats
            if (img && img.src) {
                link.href = img.src;
            } else if (canvas) {
                link.href = canvas.toDataURL("image/png");
            } else {
                return alert("QR code image not found!");
            }

            link.click();
        }
    </script>
</body>
</html>
